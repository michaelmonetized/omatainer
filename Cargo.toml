[package]
name = "omatainer"
version = "0.1.0"
edition = "2021"
description = "Omarchy-native DAW + live DJ surface"
license = "MIT"
authors = ["Omatainer"]
readme = "README.md"
keywords = ["daw", "dj", "midi", "omarchy", "audio"]
categories = ["multimedia::audio"]

[dependencies]
anyhow = "1"
arc-swap = "1.7"
cpal = "0.15"
crossbeam-channel = "0.5"
eframe = { version = "0.32", default-features = true }
egui = "0.32"
libc = "0.2"
midir = "0.10"
parking_lot = "0.12"
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["all"] }
toml = "0.8"
walkdir = "2"

[profile.dev]
opt-level = 1

[profile.release]
lto = false
codegen-units = 4
panic = "abort"
