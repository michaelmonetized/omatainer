[package]
name = "omatainer"
version = "0.1.0"
edition = "2021"
description = "Omarchy-native DAW + live DJ surface"
license = "MIT"
authors = ["Omatainer"]
readme = "README.md"
keywords = ["daw", "dj", "midi", "omarchy", "audio"]
categories = ["multimedia::audio"]

[dependencies]
ab_glyph = "0.2"
anyhow = "1"
arc-swap = "1.7"
cpal = "0.15"
crossbeam-channel = "0.5"
eframe = { version = "0.32", default-features = true }
egui = "0.32"
libc = "0.2"
icu_normalizer = "=2.3.0"
icu_casemap = "=2.3.0"
midir = "0.10"
parking_lot = "0.12"
rtrb = "0.3"
serde = { version = "1", features = ["derive", "rc"] }
sha2 = "=0.10.9"
serde_json = { version = "1", features = ["float_roundtrip"] }
symphonia = { version = "0.5", features = ["all"] }
toml = "0.8"
walkdir = "2"
lofty = { version = "=0.24.0", default-features = false }
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
url = "=2.5.8"

[profile.dev]
opt-level = 1

[profile.release]
lto = false
codegen-units = 4
panic = "abort"

[dev-dependencies]
accesskit_unix = "=0.15.0"

[patch.crates-io]
symphonia-format-riff = { path = "vendor/symphonia-format-riff" }
